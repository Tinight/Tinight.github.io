<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Descubra as histórias por trás de objetos, símbolos e tecnologias do dia a dia. Assista ao Por Trás do Óbvio no YouTube e acompanhe no Instagram."
    />
    <meta name="theme-color" content="#080d1c" />
    <meta property="og:title" content="Por Trás do Óbvio — nossos canais" />
    <meta
      property="og:description"
      content="Você vê todo dia. A história vai te surpreender."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://tinight.github.io/portrasdoobvio/"
    />
    <meta
      property="og:image"
      content="https://tinight.github.io/portrasdoobvio/assets/capa.webp"
    />
    <link rel="canonical" href="https://tinight.github.io/portrasdoobvio/" />
    <link rel="icon" href="assets/perfil.webp" type="image/webp" />
    <title>Por Trás do Óbvio — nossos canais</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #080d1c;
        color: #f8f7ef;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        min-height: 100svh;
      }
      .cover {
        height: 220px;
        background: #080d1c url("assets/capa.webp") center center/cover
          no-repeat;
        position: relative;
      }
      .cover:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 65%, #080d1c);
      }
      main {
        width: min(100% - 40px, 460px);
        margin: -48px auto 0;
        text-align: center;
        position: relative;
        padding-bottom: 40px;
      }
      .avatar {
        width: 112px;
        height: 112px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid #c6fa3b;
        box-shadow: 0 6px 26px #0005;
        display: block;
        margin: auto;
      }
      h1 {
        font-size: clamp(27px, 7vw, 32px);
        letter-spacing: -1px;
        margin: 22px 0 12px;
        line-height: 1.15;
      }
      .intro {
        font-size: 17px;
        line-height: 1.6;
        margin: 0 auto 28px;
        max-width: 350px;
        color: #d1d7e3;
      }
      .links {
        display: grid;
        gap: 14px;
      }
      .link {
        min-height: 76px;
        border-radius: 20px;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        text-align: left;
        text-decoration: none;
        box-shadow: 0 5px 18px #0002;
        transition: transform 0.15s;
      }
      .link:hover {
        transform: translateY(-2px);
      }
      .link:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 5px;
      }
      .primary {
        background: #c6fa3b;
        color: #111b08;
      }
      .secondary {
        background: #121c30;
        color: #f8f7ef;
        border: 1px solid #354159;
      }
      .icon {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #080d1c12;
      }
      .secondary .icon {
        background: #ffffff0b;
      }
      .icon svg {
        width: 21px;
        height: 21px;
      }
      .label {
        font-size: 17px;
        font-weight: 700;
        line-height: 1.35;
        flex: 1;
      }
      .arrow {
        font-size: 23px;
        opacity: 0.75;
      }
      .handle {
        font-size: 13px;
        letter-spacing: 0.4px;
        margin: 30px 0 0;
        color: #aebbd0;
      }
      @media (min-width: 700px) {
        .cover {
          height: 270px;
          background-size: auto 380px;
        }
        main {
          margin-top: -48px;
        }
      }
      @media (max-width: 360px) {
        .link {
          padding: 16px;
          gap: 12px;
        }
        .label {
          font-size: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="cover" aria-hidden="true"></div>
    <main>
      <img
        class="avatar"
        src="assets/perfil.webp"
        alt="Marca do Por Trás do Óbvio: lupa verde-lima com um olho em fundo marinho"
        width="112"
        height="112"
      />
      <h1>Por Trás do Óbvio</h1>
      <p class="intro">
        Histórias por trás de objetos, símbolos<br />e tecnologias do dia a dia.
      </p>
      <nav class="links" aria-label="Nossos canais">
        <a
          class="link primary"
          href="https://www.youtube.com/channel/UCTBAZg5oFIC6JvNK7hKeeTg"
          ><span class="icon" aria-hidden="true"
            ><svg viewBox="0 0 24 24"><path d="M7 4v16l14-8z" /></svg></span
          ><span class="label">Assistir no YouTube</span
          ><span class="arrow" aria-hidden="true">→</span></a
        >

        <a
          class="link secondary"
          href="https://www.instagram.com/breitnermaquito/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="2" width="20" height="20" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle
                cx="17.5"
                cy="6.5"
                r="1"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </span>
          <span class="label">Conheça o Criador</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </nav>
      <p class="handle">@breitnermaquito</p>
    </main>
  </body>
</html>
